<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="DevSphere">
  <defs>
    <linearGradient id="dsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Outer sphere -->
  <circle cx="24" cy="24" r="19.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Connection orbit -->
  <ellipse cx="24" cy="24" rx="19.5" ry="7" transform="rotate(-30 24 24)"
           fill="none" stroke="url(#dsGrad)" stroke-width="1.4" opacity="0.75"/>
  <!-- Letter-D structure -->
  <path d="M18 14 L18 34 L23 34 Q33 34 33 24 Q33 14 23 14 Z"
        fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Core node -->
  <circle cx="25.5" cy="24" r="2.8" fill="currentColor"/>
  <!-- Satellite node (gold) -->
  <circle cx="38.5" cy="15" r="2" fill="#D4A853"/>
</svg>