<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="DevSphere">
  <defs>
    <linearGradient id="dsDarkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Outer sphere -->
  <circle cx="24" cy="24" r="19.5" fill="none" stroke="#F4F2FF" stroke-width="2.2"/>
  <!-- Orbit (brighter gradient for dark surfaces) -->
  <ellipse cx="24" cy="24" rx="19.5" ry="7" transform="rotate(-30 24 24)"
           fill="none" stroke="url(#dsDarkGrad)" stroke-width="1.3" opacity="0.85"/>
  <!-- Letter-D structure -->
  <path d="M18 14 L18 34 L23 34 Q33 34 33 24 Q33 14 23 14 Z"
        fill="none" stroke="#F4F2FF" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Core node -->
  <circle cx="25.5" cy="24" r="2.6" fill="#F4F2FF"/>
  <!-- Satellite node (gold pops more on dark) -->
  <circle cx="38.5" cy="15" r="2.1" fill="#E5BA62"/>
</svg>